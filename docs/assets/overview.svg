      <line x1="82" y1="488" x2="672" y2="488" stroke="#293348"/>
      <g font-size="15" font-weight="600">
        <text x="84" y="472" fill="#9b9bff">GLM</text><text x="137" y="472" fill="#8392aa">5h</text><text x="162" y="472" fill="#84d3b3">24%</text>
        <text x="218" y="472" fill="#8392aa">周</text><text x="243" y="472" fill="#84d3b3">46%</text>
        <line x1="303" y1="455" x2="303" y2="476" stroke="#364158"/>
        <text x="325" y="472" fill="#8cccb6">GPT</text><text x="374" y="472" fill="#8392aa">5h</text><text x="399" y="472" fill="#84d3b3">18%</text>
        <text x="455" y="472" fill="#8392aa">周</text><text x="480" y="472" fill="#84d3b3">32%</text>
        <path d="M647 473l6-6 6 6" fill="none" stroke="#9ba9be" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="90" cy="514" r="4" fill="#79cfac"/>
        <text x="104" y="519" fill="#d0d8e6">demo-server</text>
        <text x="232" y="519" fill="#8798b1">CPU</text><text x="271" y="519" fill="#84d3b3">32%</text>
        <text x="339" y="519" fill="#8798b1">GPU</text><text x="381" y="519" fill="#84d3b3">58%</text>
        <text x="519" y="519" fill="#7890a7" font-size="13">在线 · 12 ms</text>
      </g>
    </g>
