<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Monitor Plus — 额度与算力，一眼掌握</title>
  <desc id="desc">深色桌面悬浮窗与两行紧凑模式示意。GLM、Codex 和服务器指标均为演示数据。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#080d15"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#6264df" stop-opacity=".25"/><stop offset="1" stop-color="#6264df" stop-opacity="0"/></radialGradient>
    <linearGradient id="purple"><stop stop-color="#7b7bff"/><stop offset="1" stop-color="#b6a1ff"/></linearGradient>
    <linearGradient id="green"><stop stop-color="#49bb9b"/><stop offset="1" stop-color="#93e5c4"/></linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1280" height="640" rx="24" fill="url(#bg)"/>
  <ellipse cx="994" cy="263" rx="390" ry="350" fill="url(#glow)"/>
  <g font-family="'Microsoft YaHei UI','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
    <g fill="#8090a8" font-size="13" letter-spacing="3"><text x="64" y="67">MONITOR PLUS</text></g>
    <rect x="64" y="91" width="42" height="4" rx="2" fill="#8c89ff"/>
    <text x="60" y="169" font-size="53" font-weight="700" fill="#f1f5ff">额度与算力，</text>
    <text x="60" y="240" font-size="64" font-weight="700" fill="#aaa5ff">一眼掌握。</text>
    <text x="64" y="290" font-size="22" fill="#b0bfd5">写代码，跑任务。关键状态留在桌面。</text>
    <g font-size="16" fill="#cfdaef">
      <rect x="64" y="327" width="154" height="42" rx="21" fill="#171f33" stroke="#303c56"/><text x="87" y="354">GLM / Codex</text>
      <rect x="230" y="327" width="152" height="42" rx="21" fill="#171f33" stroke="#303c56"/><text x="255" y="354">多服务器监控</text>
      <rect x="394" y="327" width="152" height="42" rx="21" fill="#171f33" stroke="#303c56"/><text x="418" y="354">置顶 · 可折叠</text>
    </g>
    <text x="64" y="423" fill="#71839f" font-size="13" letter-spacing="2">紧凑模式 · 关键数字随手看</text>
    <g filter="url(#shadow)">
