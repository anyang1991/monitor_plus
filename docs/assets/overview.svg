    </g>
    <text x="64" y="596" fill="#6c809c" font-size="13">Tauri 2 + Vue 3 + Rust</text>
    <text x="1150" y="605" text-anchor="end" fill="#6c809c" font-size="12">界面示意 · 演示数据</text>
  </g>
</svg>
