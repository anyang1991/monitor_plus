        <text x="787" y="164">5 小时限额</text><text x="1073" y="164" fill="#8bdbb8">24%</text>
        <rect x="787" y="176" width="340" height="7" rx="3.5" fill="#253044"/><rect x="787" y="176" width="82" height="7" rx="3.5" fill="url(#purple)"/>
        <text x="787" y="205" font-size="11" fill="#62768f">3 时 12 分后重置</text>
        <text x="787" y="232">每周限额</text><text x="1073" y="232" fill="#8bdbb8">46%</text>
        <rect x="787" y="244" width="340" height="7" rx="3.5" fill="#253044"/><rect x="787" y="244" width="156" height="7" rx="3.5" fill="url(#purple)"/>
        <line x1="786" y1="272" x2="1128" y2="272" stroke="#273143"/>
        <text x="787" y="298" fill="#89ceb4" font-weight="700">GPT Codex</text><text x="1084" y="298" fill="#a9c2b9">Plus</text>
        <text x="787" y="325">5 小时限额</text><text x="1073" y="325" fill="#8bdbb8">18%</text>
        <rect x="787" y="337" width="340" height="7" rx="3.5" fill="#253044"/><rect x="787" y="337" width="61" height="7" rx="3.5" fill="url(#green)"/>
        <text x="787" y="370">每周限额</text><text x="1073" y="370" fill="#8bdbb8">32%</text>
        <rect x="787" y="382" width="340" height="7" rx="3.5" fill="#253044"/><rect x="787" y="382" width="109" height="7" rx="3.5" fill="url(#green)"/>
      </g>
      <rect x="781" y="414" width="352" height="142" rx="9" fill="#19212d" stroke="#2b374b"/>
      <circle cx="797" cy="439" r="4" fill="#7ad4aa"/>
      <text x="809" y="444" font-size="13" font-weight="600" fill="#d7dfed">demo-server</text><text x="1087" y="444" font-size="11" fill="#7c92ad">12 ms</text>
      <g font-size="12" fill="#8fa1bb">
        <text x="794" y="471">CPU</text><rect x="838" y="463" width="209" height="6" rx="3" fill="#2a3546"/><rect x="838" y="463" width="67" height="6" rx="3" fill="#7ccbab"/><text x="1080" y="471" fill="#a0dcbc">32%</text>
        <text x="794" y="495">内存</text><text x="1018" y="495" fill="#c0ccdd">10.2 / 64 GB</text>
        <line x1="794" y1="507" x2="1120" y2="507" stroke="#2b3749"/>
        <text x="794" y="530" fill="#bbc8de">NVIDIA RTX 4090</text><text x="1081" y="530" fill="#c6c68c">67°C</text>
        <text x="794" y="548" font-size="10" fill="#7f97b3">利用率 58%   ·   显存 8.2 / 24 GB</text>
