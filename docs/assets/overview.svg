        <path d="M1080 71v3m0 10v3m-8-8h3m10 0h3m-14-6 2 2m8 8 2 2m0-12-2 2m-8 8-2 2"/>
        <path d="M1112 75l8 8m0-8-8 8"/>
      </g>
