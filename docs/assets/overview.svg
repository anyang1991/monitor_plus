      <path d="M781 54h352a17 17 0 0 1 17 17v31H764V71a17 17 0 0 1 17-17z" fill="#1b2331"/>
      <text x="786" y="84" font-size="18" font-weight="700" fill="#dfe6f5">Monitor<tspan fill="#9c96ff">+</tspan></text>
