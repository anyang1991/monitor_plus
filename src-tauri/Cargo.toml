[package]
name = "monitor-plus"
version = "0.3.1"
description = "GLM Coding Plan & server CPU/GPU floating monitor widget"
authors = ["Monitor Plus Contributors"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name from conflicting with the bin name on Windows.
name = "monitor_plus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
aes-gcm = "0.10"
sha2 = "0.10"
base64 = { version = "0.22", features = ["std"] }
dirs = "6"
whoami = "1"

[dev-dependencies]
rand = "0.8"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
